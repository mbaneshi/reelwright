<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Reelwright</title>
  <!-- A film reel that is also a hand-built wheel: accent ring, gold rim, six tapered
       spokes, hub, and a strip of film running off the lower right. Palette from apps/web tokens. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E47A5B"/>
      <stop offset=".2" stop-color="#D45B3F"/>
      <stop offset=".42" stop-color="#C97FB6"/>
      <stop offset=".62" stop-color="#8A6FB5"/>
      <stop offset=".82" stop-color="#4A86C5"/>
      <stop offset="1" stop-color="#4FAE9A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C95A"/>
      <stop offset=".55" stop-color="#E5B53B"/>
      <stop offset="1" stop-color="#A2802C"/>
    </linearGradient>
    <radialGradient id="well" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#2A2A2A"/>
      <stop offset="1" stop-color="#141414"/>
    </radialGradient>
    <polygon id="spoke" points="-20,-42 20,-42 14,-158 -14,-158"/>
  </defs>

  <!-- accent ring, then the film tail running off it, then the reel on top -->
  <circle cx="232" cy="232" r="214" fill="none" stroke="url(#accent)" stroke-width="14"/>

  <g fill="none">
    <path d="M196 418 C 300 434, 380 420, 476 470" stroke="url(#gold)" stroke-width="50"/>
    <path d="M196 418 C 300 434, 380 420, 476 470" stroke="#1E1A14" stroke-width="38"/>
    <path d="M196 418 C 300 434, 380 420, 476 470" stroke="#3A3226" stroke-width="20" stroke-dasharray="20 12"/>
  </g>

  <circle cx="232" cy="232" r="176" fill="url(#well)" stroke="url(#gold)" stroke-width="42"/>

  <g transform="translate(232 232)" fill="url(#gold)">
    <use href="#spoke"/>
    <use href="#spoke" transform="rotate(60)"/>
    <use href="#spoke" transform="rotate(120)"/>
    <use href="#spoke" transform="rotate(180)"/>
    <use href="#spoke" transform="rotate(240)"/>
    <use href="#spoke" transform="rotate(300)"/>
    <circle r="46"/>
    <circle r="20" fill="#A2802C"/>
    <circle r="9" cx="-5" cy="-5" fill="#F2C95A"/>
  </g>
</svg>
